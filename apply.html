<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student Portal</title>
        <link rel="stylesheet" href="style.css" />
      </head>
      <body>
        <div class="container">
          <div class="tabs">
            <input type="radio" name="tab" id="signin" checked />
            <label for="signin">Sign In</label>

            <input type="radio" name="tab" id="signup" />
            <label for="signup">Sign Up</label>

            <!-- Sign In Form -->
            <div class="content signin-content">
              <h2>Student Login</h2>

              <form>
                <input type="email" placeholder="Email Address" required />
                <input type="password" placeholder="Password" required />

                <button type="submit">Sign In</button>
              </form>
            </div>

            <!-- Sign Up Form -->
            <div class="content signup-content">
              <h2>Student Registration</h2>

              <form>
                <input type="text" placeholder="Full Name" required />
                <input type="email" placeholder="Email Address" required />
                <input type="tel" placeholder="Phone Number" required />

                <select required>
                  <option value="">Select Program</option>
                  <option>HTML Essentials</option>
                  <option>CSS Mastery</option>
                  <option>Responsive Web Design</option>
                </select>

                <input type="password" placeholder="Create Password" required />
                <input
                  type="password"
                  placeholder="Confirm Password"
                  required
                />

                <button type="submit">Sign Up</button>
              </form>
            </div>
          </div>
        </div>
      </body>
    </html>
  </body>
</html>
