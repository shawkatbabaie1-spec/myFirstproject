<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>google form</title>
  </head>
  <body>
    <style>
      body {
        background-color: antiquewhite;
      }
      .a {
        background-color:;
        width: 400px;
        height: 500px;
        margin-top: 20px;
        margin-bottom: 200px;
        margin-left: 500px;
        font-family: "Times New Roman", Times, serif;
        font-size: 15px;
      }
    </style>
    <div class="a">
      <center>
        <h3>Fill the form bellow to one of our members</h3>
        <form>
          <label for=" name"> Your Name</label> <br />
          <input type="text" placeholder=" Ali" /> <br />
          <label for="Father Name"> Your Father Name</label> <br />
          <input type="text" /> <br />
          <label for="email"> Your Email</label><br />
          <input type="email" placeholder=" someone@example.com" /> <br />
          <label for=" gender"> Gender</label><br />
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male"> Male</label>
          <input type="radio" id="female" name="gender" value="female" />
          <label for="female"> Female</label><br />
          <label for=" date "> Your Birth Day</label> <br />
          <input type="date" /> <br />
          <label for="how-did"> How Did You Hear About Us?</label> <br />
          <input type="checkbox" id="1" name=" Whatsapp" value="WhatsApp" />
          <label for="1"> WhatsApp</label><br />
          <input type="checkbox" id="2" name=" Facebook" value="Facebook" />
          <label for="2"> Facebook</label><br />
          <input type="checkbox" id="3" name=" Instagram" value="Instagram" />
          <label for="3"> Instagram</label><br />
          <button type="submit">Submit</button>
        </form>
      </center>
    </div>
  </body>
